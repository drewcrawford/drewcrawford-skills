name: Validate Agent Skills

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the Agent Skills reference validator
        run: >-
          python -m pip install
          requests
          "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - name: Validate skills
        shell: bash
        run: |
          set -euo pipefail
          for skill in skills/*; do
            if [[ -f "$skill/SKILL.md" ]]; then
              skills-ref validate "$skill"
            fi
          done
      - name: Validate local contracts
        run: |
          python skills/write-skills/scripts/validate_skill.py skills/*
          python -m unittest discover -s tests -v
